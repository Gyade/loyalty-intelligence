name: Hourly RSS Monitor & Data Generation

on:
  schedule:
    # S'exécute toutes les heures
    - cron: '0 * * * *'
  workflow_dispatch: # Permet de déclencher le script manuellement depuis GitHub

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install rss-parser @supabase/supabase-js ws axios @google/genai

      - name: Run data generator
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node generate-data.js
