name: Hourly RSS Monitor & Daily Report

on:
  schedule:
    - cron: '0 * * * *' # S'exécute toutes les heures pile
  workflow_dispatch: # Permet de le lancer manuellement depuis l'onglet Actions de GitHub

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install rss-parser @supabase/supabase-js

      - name: Run monitoring script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: node generate-data.js
